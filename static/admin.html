<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaCart AI Operator</title><link rel="stylesheet" href="/static/style.css"></head><body><header><div class="brand">NOVACART<span>AI</span> / OPERATOR</div><a href="/">Storefront</a></header><main class="admin"><section class="panel"><h1>AI Operations</h1><p>Connect real providers. This dashboard never fabricates product or order data.</p><div id="health" class="chips"></div><div class="row"><input id="token" placeholder="Admin token" type="password"><button onclick="save()">Save</button></div></section>
<section class="panel"><h2>Product discovery</h2><div class="row"><input id="q" placeholder="Search CJ, e.g. portable blender"><button onclick="search()">Search supplier</button></div><div id="results"></div></section><section class="panel"><h2>Live operations</h2><button onclick="orders()">Refresh WooCommerce orders</button><pre id="out"></pre></section></main>
<script>
const H=k=>({'x-admin-token':localStorage.getItem('token')||''}[k]||''); function save(){localStorage.setItem('token',document.querySelector('#token').value);status()}
async function status(){let h=await fetch('/api/health').then(r=>r.json());document.querySelector('#health').innerHTML=Object.entries(h.providers).map(([k,v])=>`<span class="chip ${v?'on':''}">${k}: ${v?'CONNECTED':'NOT CONFIGURED'}</span>`).join('')} async function search(){let q=encodeURIComponent(document.querySelector('#q').value);let r=await fetch('/api/cj/search?q='+q,{headers:H('x-admin-token')});let d=await r.json();document.querySelector('#results').innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>'} async function orders(){let r=await fetch('/api/orders',{headers:H('x-admin-token')});document.querySelector('#out').textContent=JSON.stringify(await r.json(),null,2)}status();
</script></body></html>
